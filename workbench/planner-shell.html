<title>Raynor Realty Bottom Line</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Layout: one step bar across the top, one working page at a time on the left, a live margin rail pinned on the right. */
  :root{
    --bg:#eceff1; --panel:#ffffff; --panel-2:#f5f7f8; --rule:#d5dce1; --rule-soft:#e5eaed;
    --ink:#15212c; --ink-2:#4a5864; --ink-3:#7a8792;
    --accent:#2b5a9e; --accent-ink:#1f477f; --accent-tint:#e3ebf7; --accent-line:#b9cbe6;
    --gold:#8f6428; --gold-line:#d2ad6c;
    --good:#1b7a4c; --good-bg:#e1f2e8; --warn:#985900; --warn-bg:#fbeed6; --bad:#b1352b; --bad-bg:#fae3df;
    --font-display:"Newsreader", "Iowan Old Style", Georgia, serif;
    --font-ui:"Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
    --font-data:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --bar-h:54px; --rail-w:318px;
    --shadow:0 1px 2px rgba(15,25,35,.06), 0 6px 18px -10px rgba(15,25,35,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0e141a; --panel:#161e26; --panel-2:#1c2630; --rule:#2c3945; --rule-soft:#222d37;
      --ink:#e5eaee; --ink-2:#a6b2bc; --ink-3:#71808c;
      --accent:#7ba6e8; --accent-ink:#a3c2f2; --accent-tint:#1c2b40; --accent-line:#34507a;
      --gold:#dfb469; --gold-line:#7d6236;
      --good:#55cf95; --good-bg:#12301f; --warn:#e3a13c; --warn-bg:#382713; --bad:#ea7063; --bad-bg:#3a1b17;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 22px -10px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0e141a; --panel:#161e26; --panel-2:#1c2630; --rule:#2c3945; --rule-soft:#222d37;
    --ink:#e5eaee; --ink-2:#a6b2bc; --ink-3:#71808c;
    --accent:#7ba6e8; --accent-ink:#a3c2f2; --accent-tint:#1c2b40; --accent-line:#34507a;
      --gold:#dfb469; --gold-line:#7d6236;
    --good:#55cf95; --good-bg:#12301f; --warn:#e3a13c; --warn-bg:#382713; --bad:#ea7063; --bad-bg:#3a1b17;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 22px -10px rgba(0,0,0,.6);
  }
  *{ box-sizing:border-box; }
  html{ scroll-padding-top:calc(var(--bar-h) + 12px); }
  body{ background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:13.5px; line-height:1.4; }
  button, select, input, textarea{ font:inherit; color:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
  .mono{ font-family:var(--font-data); font-variant-numeric:tabular-nums; }
  .muted{ color:var(--ink-2); } .faint{ color:var(--ink-3); } .small{ font-size:12px; } .tiny{ font-size:11px; }
  .strong{ font-weight:600; }
  .good{ color:var(--good); } .warn{ color:var(--warn); } .bad{ color:var(--bad); }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ---------- top bar ---------- */
  .bar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:30; height:var(--bar-h); display:flex; align-items:center; gap:10px; box-shadow:inset 0 -1px 0 var(--gold-line);
    padding-inline:16px; background:var(--panel); border-bottom:1px solid var(--rule); }
  .brand{ display:flex; align-items:center; gap:9px; line-height:1.1; white-space:nowrap; }
  .brand img{ width:34px; height:34px; border-radius:50%; flex:0 0 34px; display:block; box-shadow:0 0 0 1px var(--gold-line); }
  .brand-t{ display:flex; flex-direction:column; }
  .brand b{ font-family:var(--font-display); font-weight:600; font-size:16px; letter-spacing:-.005em; }
  .brand span{ font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  .steps{ display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; flex:1 1 auto; min-width:0; }
  .steps::-webkit-scrollbar{ display:none; }
  .step{ display:flex; align-items:center; gap:5px; padding:7px 6px; border:none; background:none; border-radius:8px; cursor:pointer;
    font-weight:600; font-size:13px; color:var(--ink-2); white-space:nowrap; }
  .step:hover{ background:var(--panel-2); color:var(--ink); }
  .step[aria-current="page"]{ background:var(--accent-tint); color:var(--accent-ink); box-shadow:inset 0 -2px 0 var(--gold); }
  .step .n{ width:19px; height:19px; border-radius:50%; display:inline-grid; place-items:center; font-family:var(--font-data); font-size:10.5px;
    border:1.5px solid currentColor; }
  .step .dot{ width:7px; height:7px; border-radius:50%; background:var(--warn); }
  .step-sep{ width:1px; background:var(--rule); margin:8px 4px; flex:0 0 1px; }
  .bar-actions{ display:flex; align-items:center; gap:8px; }
  .src{ font-size:11.5px; color:var(--ink-3); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn{ display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:8px; border:1px solid var(--rule); background:var(--panel);
    font-weight:600; font-size:12.5px; cursor:pointer; white-space:nowrap; }
  .btn:hover{ border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--panel); }
  .btn.primary:hover{ filter:brightness(1.08); color:var(--panel); }
  .btn.danger{ border-color:var(--bad); color:var(--bad); }
  .btn.sm{ padding:3px 8px; font-size:11.5px; border-radius:6px; }
  .link{ background:none; border:none; padding:0; color:var(--accent-ink); font-weight:600; cursor:pointer; text-decoration:underline; text-underline-offset:2px; font-size:12.5px; }
  .menu-wrap{ position:relative; }
  .menu{ position:absolute; right:0; top:calc(100% + 6px); width:300px; background:var(--panel); border:1px solid var(--rule); border-radius:12px;
    box-shadow:var(--shadow); padding:12px; display:flex; flex-direction:column; gap:10px; z-index:40; }
  .menu p{ margin:0; }
  .menu .btn{ justify-content:center; }

  /* ---------- main grid ---------- */
  .main{ display:grid; grid-template-columns:minmax(0,1fr) var(--rail-w); gap:18px; padding-inline:16px; padding-block:16px 48px; max-width:1560px; margin:0 auto; align-items:start; }
  .page{ min-width:0; display:flex; flex-direction:column; gap:14px; }
  .rail{ position:sticky; top:calc(var(--bar-h) + 16px); max-height:calc(100vh - var(--bar-h) - 32px); overflow:auto; display:flex; flex-direction:column; gap:12px;
    scrollbar-width:thin; }
  @media (max-width:1080px){
    .main{ grid-template-columns:minmax(0,1fr); }
    .rail{ position:static; max-height:none; order:-1; }
    .rail .inspector{ display:none; }
    .main.rail-off{ grid-template-columns:minmax(0,1fr); }
    .rail-tab-wrap{ position:static; order:-1; } .rail-tab{ writing-mode:horizontal-tb; width:100%; justify-content:center; padding:8px; }
  }

  .page-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .page-head h1{ font-family:var(--font-display); font-weight:600; font-size:26px; margin:0; letter-spacing:-.01em; text-wrap:balance; }
  .page-head .kicker{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:var(--gold); }
  .lead{ margin:4px 0 0; max-width:78ch; color:var(--ink-2); line-height:1.5; }
  .panel{ background:var(--panel); border:1px solid var(--rule); border-radius:12px; }
  .panel-h{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:12px 14px 8px; }
  .panel-h h2{ font-size:14.5px; font-weight:700; margin:0; color:var(--accent-ink); }
  .panel-h-btn-wrap{ margin:0; font-size:inherit; }
  .panel-h-btn{ display:flex; align-items:baseline; gap:10px; width:100%; background:none; border:none; padding:12px 14px; cursor:pointer; text-align:left; color:inherit; }
  .panel-h-btn:hover .sec-name{ text-decoration:underline; text-underline-offset:3px; }
  .panel-h-btn[aria-expanded="true"]{ padding-bottom:6px; }
  .sec-name{ font-size:14.5px; font-weight:700; color:var(--accent-ink); white-space:nowrap; }
  .sec-sum{ font-size:12px; font-weight:400; color:var(--ink-2); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .caret-i{ width:12px; flex:0 0 12px; color:var(--ink-3); font-size:11px; }
  .mini:disabled{ opacity:.45; cursor:default; }
  .panel-b{ padding:0 14px 14px; }
  h2.sec{ font-family:var(--font-display); font-weight:600; font-size:19px; margin:6px 0 0; }
  .banner{ display:flex; justify-content:space-between; gap:12px; align-items:center; border-radius:10px; padding:9px 13px; font-size:13px; }
  .banner.good{ background:var(--good-bg); color:var(--good); } .banner.bad{ background:var(--bad-bg); color:var(--bad); }
  .note{ font-size:12px; color:var(--ink-2); line-height:1.5; margin:0; max-width:90ch; }
  .next{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 14px; border:1px dashed var(--rule); border-radius:12px; }

  /* ---------- inputs ---------- */
  .affix{ display:inline-flex; align-items:center; background:var(--panel); border:1px solid var(--rule); border-radius:7px; overflow:hidden; }
  .affix:focus-within{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-tint); }
  .affix .pre, .affix .suf{ font-family:var(--font-data); font-size:11.5px; color:var(--ink-3); padding-inline:6px; white-space:nowrap; }
  .affix input{ border:none; background:transparent; min-width:0; padding:5px 6px; outline:none; }
  input.num{ font-family:var(--font-data); font-size:12.5px; font-variant-numeric:tabular-nums; text-align:right; }
  .affix input.num{ width:84px; }
  .affix.w-sm input.num{ width:58px; } .affix.w-lg input.num{ width:104px; }
  .affix.ro{ background:var(--panel-2); border-style:dashed; padding:5px 8px; font-family:var(--font-data); font-size:12.5px; }
  select{ background:var(--panel); border:1px solid var(--rule); border-radius:7px; padding:4px 6px; font-size:12.5px; max-width:100%; }
  input[type="text"].txt{ background:transparent; border:1px solid transparent; border-radius:6px; padding:3px 5px; width:100%; min-width:0; }
  input[type="text"].txt:hover{ border-color:var(--rule); }
  input[type="text"].txt:focus{ border-color:var(--accent); background:var(--panel); outline:none; }
  input[type="checkbox"]{ width:16px; height:16px; accent-color:var(--accent); cursor:pointer; margin:0; }
  .switch{ display:flex; gap:9px; align-items:flex-start; cursor:pointer; font-size:13px; }
  .switch input{ margin-top:2px; }
  input[type="search"]{ background:var(--panel); border:1px solid var(--rule); border-radius:7px; padding:5px 9px; font-size:12.5px; width:220px; max-width:100%; }

  /* Portfolio fields: label + input on the left, what it is and where to find it on the right */
  .fieldset{ display:grid; grid-template-columns:minmax(0,1fr); }
  .frow{ display:grid; grid-template-columns:190px 190px minmax(0,1fr); gap:18px; align-items:center; padding:10px 0; border-top:1px solid var(--rule-soft); }
  /* Every Portfolio control fills the same 190px box, so values line up and never run into the description. */
  .fctrl{ width:100%; min-width:0; }
  .fctrl .affix{ display:flex; width:100%; height:32px; }
  .fctrl .affix input.num{ width:auto; flex:1 1 auto; min-width:0; }
  .fctrl .affix .pre, .fctrl .affix .suf{ flex:0 0 auto; }
  .fctrl .affix.ro{ justify-content:flex-end; align-items:center; }
  .toggle-box{ display:flex; align-items:center; gap:8px; height:32px; padding-inline:9px; border:1px solid var(--rule); border-radius:7px; background:var(--panel); cursor:pointer; font-size:12.5px; font-weight:600; }
  .frow:first-child{ border-top:none; }
  .frow label{ font-weight:600; font-size:13px; }
  .frow .help{ font-size:12px; color:var(--ink-2); line-height:1.45; }
  .frow .help b{ color:var(--ink); font-weight:600; }
  .frow.flash{ animation:flash 1.6s ease-out; }
  @keyframes flash{ 0%{ background:var(--accent-tint); } 100%{ background:transparent; } }
  @media (max-width:760px){ .frow{ grid-template-columns:1fr; gap:4px; } }

  /* ---------- tables ---------- */
  .toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .toolbar .spacer{ flex:1 1 auto; }
  .table-wrap{ overflow-x:auto; }
  table.grid{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:760px; }
  .grid th{ font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); text-align:right; padding:7px 8px;
    border-bottom:1px solid var(--rule); white-space:nowrap; position:sticky; top:0; background:var(--panel); z-index:1; }
  .grid td{ padding:3px 8px; border-bottom:1px solid var(--rule-soft); text-align:right; vertical-align:middle; white-space:nowrap; height:32px; }
  .grid .l{ text-align:left; } .grid .c{ text-align:center; }
  .grid th:first-child, .grid td:first-child{ padding-left:14px; }
  .grid th:last-child, .grid td:last-child{ padding-right:14px; }
  .grid .tcol{ width:62px; }
  .grid .tcol-wide{ width:84px; }
  .grid th.grp{ border-bottom:1px solid var(--rule-soft); }
  .addons-grid input.num{ width:62px; }
  .grid.addons-grid .name-cell{ min-width:200px; max-width:260px; }
  .addons-grid .name-cell input{ width:100%; }
  .addons-grid select{ max-width:100px; }
  .addons-grid select.state{ width:74px; }
  .addons-grid th{ white-space:normal; line-height:1.25; }
  .addons-grid th.tcol{ width:78px; }
  .addons-grid .tcol-wide{ width:78px; }
  .grid .tcol-wide.focus{ background:var(--accent-tint); }
  .grid .tcol.focus{ background:var(--accent-tint); }
  .grid th.tcol.focus{ color:var(--accent-ink); }
  .grid tbody tr.item{ cursor:pointer; }
  .grid tbody tr.item:hover td{ background:var(--panel-2); }
  .grid tbody tr.item.sel td{ background:var(--accent-tint); }
  .grid tbody tr.item.sel td:first-child{ box-shadow:inset 3px 0 0 var(--accent); }
  .grid tr.dim td{ color:var(--ink-3); }
  .grid tr.dim td .txt, .grid tr.dim td .num{ opacity:.6; }
  .grid tr.grp td{ background:var(--panel-2); height:36px; font-weight:600; }
  .grid tr.cat td{ height:28px; font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--accent-ink); }
  .grid tr.add td{ border-bottom:none; }
  .grid .name-cell{ min-width:230px; max-width:320px; white-space:normal; }
  .grid .name-cell .txt{ font-weight:500; }
  .caret{ background:none; border:none; cursor:pointer; color:var(--ink-3); width:20px; padding:0; font-size:12px; }
  .tag{ display:inline-block; font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); border:1px solid var(--rule);
    border-radius:4px; padding:0 4px; margin-left:6px; vertical-align:middle; line-height:15px; }
  .tag.warn{ color:var(--warn); border-color:var(--warn); }
  .tag.link{ color:var(--accent-ink); border-color:var(--accent-line); }
  .mini{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; background:var(--panel); border:1px solid var(--rule); border-radius:5px;
    padding:1px 6px; cursor:pointer; color:var(--ink-2); }
  .mini:hover{ border-color:var(--accent); color:var(--accent-ink); }
  .x{ background:none; border:none; color:var(--ink-3); font-size:15px; cursor:pointer; padding:1px 6px; border-radius:5px; line-height:1; }
  .x:hover{ color:var(--bad); background:var(--bad-bg); }
  select.state{ font-weight:600; font-size:11.5px; padding:2px 4px; }
  select.state.charged{ color:var(--good); border-color:var(--good); }
  select.state.included{ color:var(--accent-ink); border-color:var(--accent-line); }
  select.state.off{ color:var(--ink-3); }
  .locked{ font-size:11.5px; color:var(--ink-2); }
  .out-n{ font-size:10px; color:var(--warn); font-weight:600; }

  /* ---------- comparison (summary) ---------- */
  .compare{ width:100%; border-collapse:collapse; font-size:13px; }
  .compare th, .compare td{ padding:6px 12px; text-align:right; border-bottom:1px solid var(--rule-soft); white-space:nowrap; }
  .compare th:first-child, .compare td:first-child{ text-align:left; padding-left:14px; white-space:normal; }
  .compare thead th{ font-size:12px; font-weight:700; color:var(--ink); border-bottom:1px solid var(--rule); vertical-align:bottom; }
  .compare thead th .faint{ font-weight:500; }
  .compare td{ font-family:var(--font-data); font-variant-numeric:tabular-nums; }
  .compare td:first-child{ font-family:var(--font-ui); color:var(--ink-2); }
  .compare tr.sub td:first-child{ padding-left:30px; font-size:12.5px; }
  .compare tr.sub td{ color:var(--ink-2); font-size:12.5px; }
  .compare tr.total td{ font-weight:600; color:var(--ink); border-top:1px solid var(--rule); }
  .compare tr.total td:first-child{ color:var(--ink); }
  .compare tr.big td{ font-size:15px; font-weight:700; }
  .compare th.focus, .compare td.focus{ background:var(--accent-tint); }
  .pill{ display:inline-block; font-family:var(--font-ui); font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:2px 8px; border-radius:999px; white-space:nowrap; }
  .pill.good{ background:var(--good-bg); color:var(--good); } .pill.warn{ background:var(--warn-bg); color:var(--warn); } .pill.bad{ background:var(--bad-bg); color:var(--bad); }
  .todo{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
  .todo li{ display:flex; gap:12px; align-items:baseline; justify-content:space-between; padding:8px 14px; border-top:1px solid var(--rule-soft); }
  .todo li:first-child{ border-top:none; }
  .todo .what{ min-width:0; }
  .todo .what b{ font-weight:600; }
  .todo .what div{ font-size:12px; color:var(--ink-2); }
  .flow{ display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:10px; }
  .flow button{ text-align:left; background:var(--panel); border:1px solid var(--rule); border-radius:10px; padding:10px 12px; cursor:pointer; display:flex; flex-direction:column; gap:3px; }
  .flow button:hover{ border-color:var(--accent); }
  .flow b{ font-size:13px; } .flow span{ font-size:11.5px; color:var(--ink-2); line-height:1.4; }
  .flow .n{ font-family:var(--font-data); font-size:11px; color:var(--accent-ink); font-weight:600; }
  @media (max-width:900px){ .flow{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .two{ display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:14px; align-items:start; }
  @media (max-width:1200px){ .two{ grid-template-columns:minmax(0,1fr); } }

  /* ---------- prices ---------- */
  .price-cols{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; }
  @media (max-width:980px){ .price-cols{ grid-template-columns:minmax(0,1fr); } }
  .pcard{ background:var(--panel); border:1px solid var(--rule); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .pcard.focus{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .pcard h3{ margin:0; font-size:15px; font-weight:700; }
  .pcard .sub-h{ font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin-top:4px; }
  .row-b{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .track{ position:relative; height:22px; display:flex; align-items:center; }
  input[type="range"]{ -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:999px; margin:0; cursor:pointer; position:relative; z-index:1;
    background:linear-gradient(to right, var(--accent) var(--fill,0%), var(--rule) var(--fill,0%)); }
  input[type="range"]::-webkit-slider-runnable-track{ height:6px; background:transparent; }
  input[type="range"]::-moz-range-track{ height:6px; background:transparent; }
  input[type="range"]::-webkit-slider-thumb{ -webkit-appearance:none; width:17px; height:17px; margin-top:-5.5px; border-radius:50%; background:var(--panel); border:2px solid var(--accent); }
  input[type="range"]::-moz-range-thumb{ width:17px; height:17px; border-radius:50%; background:var(--panel); border:2px solid var(--accent); }
  .tick{ position:absolute; top:50%; width:3px; height:16px; border-radius:2px; transform:translate(-1.5px,-50%); pointer-events:none; z-index:2; }
  .tick.floor{ background:var(--bad); } .tick.target{ background:var(--good); } .tick.anchor{ background:var(--ink-3); height:11px; } .tick.renewal0{ background:var(--warn); height:11px; }
